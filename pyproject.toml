[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "edge: marks tests as edge case tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501", "E701", "E702", "E741", "B008", "N802", "N803", "N806", "UP007", "UP017", "UP035", "UP045", "SIM102", "SIM103", "SIM114", "SIM117", "C420", "A004"]

[tool.ruff.lint.isort]
known-first-party = ["config", "api", "agents", "memory", "monitor", "utils"]

[tool.ruff.lint.per-file-ignores]
"test_all.py" = ["E402", "F401", "I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
